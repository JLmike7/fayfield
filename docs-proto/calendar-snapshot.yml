# calendar-snap-proto-20260905
name: calendar-snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: calendar-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.ref == 'refs/heads/proto/calendar-snap-20260905'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: proto/calendar-snap-20260905

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch public ICS → snapshot JSON
        run: node scripts/calendar-snapshot.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "Fayfield Engineer"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calendar-snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore(calendar): refresh snapshot [skip ci] calendar-snap-proto-20260905"
          git push origin HEAD:proto/calendar-snap-20260905
